id: page1
title: What Are Tools?
content: >
  ## What Are Tools?


  **Tools** are what the AI *can do*. Remember the OpenAI definition from
  earlier: an agent has instructions (what it should do), guardrails (what it
  should not do), and tools (what it *can* do). Without tools, all it can do is
  respond from training data. With tools, it can check the weather, look up
  who's in space, query an API, post to a website, and more. The possibilities are endless!

  The key word is **choose**. You don't tell it which tool to use (although you could). *It decides
  based on the user's message and the tool descriptions.* That autonomy is what
  makes it an **agent**.


  On the next page, the AI now has **one tool**: `get_weather`.


  Ask it *"What's the weather in Charlotte right now?"* again. The same question
  from Lab 1! Watch the **Thinking** section and the **tool cards** that appear
  in the chat.


  Also try: *"Who won the last Super Bowl?"* Does it use the weather tool for
  that?


  **On the next page, click the green play button (top right) to load the Agent
  Playground.**
