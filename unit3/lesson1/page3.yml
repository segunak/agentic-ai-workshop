# yaml-language-server: $schema=https://vscodeedu.com/assets/schema/course-v2.schema.json
id: page3
title: The Agent in Action
content: >
  ## What Happened?


  You saw a tool card appear in the chat when you asked a question about the weather.
  The AI called the tool, got the information, and responded. Compare that to Lab 1,
  where it could only respond from training data.


  That is the difference between generative and agentic behavior. Same AI, same
  question, but now it has a tool and it used it.
questionGroups:
  - id: "1"
    content: Think about what you observed in the chat.
    questions:
      - id: "1"
        type: choice
        content: Did you have to tell the AI which tool to use, or did it figure that
          out on its own?
        options:
          - id: a
            value: I had to tell it
            incorrectExplanation: Even if you mentioned the weather in your question, you
              didn't instruct it to call a specific tool. It matched your
              question to the right tool on its own.
          - id: b
            value: It figured it out on its own
            explanation: Exactly. The AI read your message, determined the weather tool
              was relevant, and called it. You did not have to specify which
              tool to use. That autonomy is what makes it an agent.
            isCorrect: true
  - id: "2"
    questions:
      - id: "1"
        type: choice
        content: When you asked a question the weather tool couldn't help with, did it
          use the tool anyway?
        options:
          - id: a
            value: Yes
            incorrectExplanation: The agent knew the tool wasn't relevant to that question
              and skipped it.
          - id: b
            value: No, it knew that question didn't need the weather tool
            explanation: Correct! The agent reasoned about which tool was relevant and only
              used it when appropriate.
            isCorrect: true
