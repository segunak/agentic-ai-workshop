title: Agent Playground
content: >
  ## Lab 2: One Tool Enabled


  **Click the green play button (top right) to load the Agent Playground.**


  **For a larger chat window, click the X on the `playground-lab2.html` tab to close
  the code view.**


  The AI now has one tool: Weather.


  Run these same prompts from Lab 1 and compare:


  1. `What's the weather in Charlotte right now?` (this one failed in Lab 1.
  Watch what happens now!)

  2. `What won Best Picture at the last Oscars?` (can the weather tool help
  with this?)

  3. `What is the powerhouse of the cell?` (does it still handle this one?)


  Watch for the **tool card** that appears in the chat. Which question triggers
  the tool? Which ones don't?
