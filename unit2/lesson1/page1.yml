title: Try It Yourself
content: >
  ## Lab 1: Chat with the AI


  Remember when ChatGPT first came out in late 2022? People were blown away, but
  if you asked it about anything recent, it had no idea. It couldn't tell you
  yesterday's weather, who won last week's game, or what just happened in the
  news. It could only work with what it learned during training.


  On the next page you'll open the **Agent Playground**, a chat interface
  connected to a real AI model. Ask it some questions and see how it does.


  Try these:

  - "What's the weather in Charlotte right now?"

  - "What won Best Picture at the last Oscars?"

  - "What are Segun Akinyemi's top cinnamon roll spots in Charlotte?"

  - "What is the powerhouse of the cell?"

  - "What is the anime Steins;Gate about?"


  Pay attention to its answers. Can it actually give you current information?


  **On the next page, click the green play button (top right) to load the Agent
  Playground.**
