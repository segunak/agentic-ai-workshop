# yaml-language-server: $schema=https://vscodeedu.com/assets/schema/course-v2.schema.json
id: page3
title: What Did You Notice?
content: |
  ## Reflection

  That AI had no tools. No way to check the weather, look up recent events, or reach the internet. Everything it told you came from its training data, and that data has a cutoff date. Anything after that, it genuinely does not know.
questionGroups:
  - id: "1"
    content: Think back to what happened in the playground.
    questions:
      - id: "1"
        type: choice
        content: When you asked about something that requires real-time or very recent
          information, what happened?
        options:
          - id: a
            value: It gave me accurate, up-to-date information
            incorrectExplanation: Without tools, the model has no way to access live data or
              events after its training cutoff.
          - id: b
            value: It hedged, gave outdated info, or said it couldn't answer
            explanation: Without tools, it can only work with what it learned during
              training. It might give a vague answer with a disclaimer, or it
              might say it doesn't know. Either way, it can't get real-time data.
            isCorrect: true
  - id: "2"
    questions:
      - id: "1"
        type: choice
        content: The AI has a limit on how much conversation history and information
          it can process at once. What is that limit called?
        options:
          - id: a
            value: Context Window
            explanation: The context window is how much information the AI can hold at
              once, like short-term memory. Larger context windows let AI handle
              longer conversations and bigger documents.
            isCorrect: true
          - id: b
            value: Training Data
            incorrectExplanation: Training data is what the AI learned from before you
              used it. The limit on what it can process at once has a different name.
          - id: c
            value: Memory Bank
            incorrectExplanation: That sounds right but is not the technical term.
              The industry calls it the context window.
