title: Agent Playground
content: >
  ## Lab 1: Chat with the AI


  **Click the green play button (top right) to load the Agent Playground.**


  **For a larger chat window, click the X on the `playground-lab1.html` tab to close
  the code view.**


  Try the prompts below and see how the AI responds.


  Run these prompts in order:


  1. `What's the weather in Charlotte right now?`

  2. `Who is in space right now?`

  3. `Have there been any major earthquakes this week?`

  4. `What are Segun Akinyemi's top cinnamon roll spots in Charlotte?`

  5. `What is the powerhouse of the cell?`

  6. `What is the anime Steins;Gate about?`


  Pay attention to its answers. Which questions can it handle? Which ones give
  it trouble? What is the difference between those two groups?
