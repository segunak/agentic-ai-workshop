# yaml-language-server: $schema=https://vscodeedu.com/assets/schema/course-v2.schema.json
id: page4
title: What Did You Build?
content: |
  ## Reflection

  You configured a custom AI agent. You wrote its instructions, chose its tools, and tested it.
questionGroups:
  - id: "1"
    content: "Think about the agent you just built."
    questions:
      - id: "1"
        type: choice
        content: "When you changed your agent's instructions, what happened?"
        options:
          - id: a
            value: "The agent's personality and tone changed"
            isCorrect: true
            explanation: "Instructions shape HOW the agent communicates. Same tools, different personality."
          - id: b
            value: "Nothing changed"
            isCorrect: false
            incorrectExplanation: "Try changing the instructions to something very different and compare the responses."
          - id: c
            value: "The agent got new tools"
            isCorrect: false
            incorrectExplanation: "Instructions control personality, not tool access. Tools are separate."
  - id: "2"
    questions:
      - id: "1"
        type: choice
        content: When humans rate AI outputs and the model learns from those ratings
          to get better over time, what is that process called?
        options:
          - id: a
            value: RLHF (Reinforcement Learning from Human Feedback)
            explanation: RLHF is how models improve after launch. Humans rate outputs,
              and the model adjusts to be more helpful and less harmful. It is
              a big part of why ChatGPT improved so quickly.
            isCorrect: true
          - id: b
            value: RAG (Retrieval-Augmented Generation)
            incorrectExplanation: RAG is about retrieving external data to improve
              responses. The process of learning from human ratings is RLHF.
          - id: c
            value: GANs (Generative Adversarial Networks)
            incorrectExplanation: GANs use two competing models to improve. The process
              of improving from human feedback is called RLHF.
  - id: "3"
    questions:
      - id: "1"
        type: reflection
        content: "If you could give an AI agent any tool in the world, what would it do and who would it help?"
        options: []
