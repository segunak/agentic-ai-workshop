id: page3
title: Post to the Live Feed
content: |
  ## Post to the Live Feed

  **Click the green play button (top right) to reopen the Agent Playground.**

  There is a live website projected on the screen in this room. Your agent has a tool called **Live Feed** that can post messages directly to it.

  Here is your goal: enable the **Live Feed** tool, then tell your agent to post a message. Include your name so you can spot it on the screen. Watch the projected website and look for your message to appear.

  Try something like: "Post to the live feed. Say hello from [your name] at WiDS Charlotte!"

  You can post as many messages as you want. Experiment with different agent personalities and see how each one writes its post differently.
