id: page3
title: Post to the Live Feed
content: |
  ## Post to the Live Feed

  **Click the green play button (top right) to open the Live Feed Playground.**

  **For a larger chat window, click the X on the `agent-workshop-livefeed.html` tab to close the code view.**

  There is a live website projected on the screen in this room. Your agent has the **Live Feed** tool already enabled. It posts messages directly to that website for everyone to see.

  Your goal: tell your agent to post a message with your name and watch it appear on the screen.

  Get creative. Turn on other tools and use them to shape your posts. Have the agent check the weather and post about it. Grab a dad joke and share it. Look up who is in space and announce it on the feed. Mix tools together and customize your agent's instructions to change how it writes.

  You can also ask the agent to add **tags** to your post. Tags can be anything you want. Try "fun", "science", "charlotte", or make up your own.
