    questions:
      - id: "1"
        type: multiple
        content: Which of these did your agent demonstrate today? (Select all that
          apply)
        options:
          - id: a
            value: Autonomous tool selection
            explanation: The agent chose which tools to call on its own.
            isCorrect: true
          - id: b
            value: Multi-step reasoning
            explanation: It chained multiple tool calls to answer complex questions.
            isCorrect: true
          - id: c
            value: Retrieving external data to augment responses
            explanation: It fetched live weather, space crew data, and earthquake reports to
              augment its answers. That's the RAG pattern in action.
            isCorrect: true
          - id: d
            value: Replacing human workers
            incorrectExplanation: Agents assist and augment. They don't replace human expertise.
