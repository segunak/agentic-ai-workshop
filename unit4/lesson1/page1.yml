id: page1
title: Multiple Tools, One Agent
content: >
  ## More Tools, One Agent


  Real agents have access to many tools and **choose between them**, or **chain
  several** in sequence.


  You now have several tools:


  * 🌤️ **Weather** - live weather and forecast for any city


  * 🚀 **People in Space** - who is currently in space right now


  * 🌍 **Earthquakes** - significant earthquakes from the past week


  * 🥐 **Cinnamon Roll Rankings** - Segun Akinyemi's cinnamon roll
  rankings for Charlotte, NC


  👉 Try: *"What's the weather in Charlotte, who's in space right now, any recent earthquakes, and where should I get cinnamon rolls?"*


  Watch the **Thinking** section and **tool cards** in the chat. Will it use one
  tool? Two? All of them? The agent decides, not you.


  **On the next page, click the green play button (top right) to load the Agent
  Playground.**
