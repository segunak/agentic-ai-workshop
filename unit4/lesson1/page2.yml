title: Agent Playground
content: >
  ## Lab 3: More Tools Enabled


  **Click the green play button (top right) to load the Agent Playground.**


  **For a larger chat window, click the X on the `playground-lab3.html` tab to close
  the code view.**


  The AI now has several tools: weather, people in space, earthquakes, and cinnamon
  roll rankings. You can toggle tools on and off using the checkboxes!


  Try this:


  1. `What's the weather in Charlotte right now?`

  2. `Where should I get cinnamon rolls in Charlotte?`

  3. `Who is in space right now?`

  4. `Have there been any major earthquakes this week?`


  Experiment! Toggle tools on and off, then ask the same question and watch how
  the agent adapts.
