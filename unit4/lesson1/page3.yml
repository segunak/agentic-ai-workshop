# yaml-language-server: $schema=https://vscodeedu.com/assets/schema/course-v2.schema.json
id: page3
title: Putting It Together
content: >
  ## Multiple Tools, One Answer


  The agent chained multiple tool calls to answer a single
  question. It decided the order, picked the tools, and combined the results
  into one response. That's the power of agents. They can orchestrate multiple tools and data sources to answer complex questions.


  
questionGroups:
  - id: "1"
    content: Think about how the agent handled your questions.
    questions:
      - id: "1"
        type: choice
        content: You just asked the agent a question and it used tools to get
          real-time data, then wrote you a summary. Which part was generative
          and which part was agentic?
        options:
          - id: a
            value: Using the tools was generative, writing the summary was agentic
            incorrectExplanation: It's the other way around. Using tools autonomously
              is the agentic part. Writing the summary is the generative part.
          - id: b
            value: Using the tools was agentic, writing the summary was generative
            explanation: Correct! Deciding which tools to call and calling them is
              agentic behavior. Writing the final response from those results
              is generative behavior. Same AI, both behaviors in one answer.
            isCorrect: true
          - id: c
            value: The whole thing was agentic
            incorrectExplanation: The tool usage was agentic, but the written summary
              at the end is generative. It's both in one response.
          - id: d
            value: Neither
            incorrectExplanation: This uses AI for both generation and autonomous action.
  - id: "2"
    questions:
      - id: "1"
        type: choice
        content: There is an industry wide standard that gives AI models a universal
          way to connect to tools. Think of it like USB-C for AI. What is it
          called?
        options:
          - id: a
            value: MCP (Model Context Protocol)
            explanation: MCP is a standard created by Anthropic for connecting tools
              to AI models. Instead of building custom integrations for every
              tool, MCP provides one standard connector.
            isCorrect: true
          - id: b
            value: RAG (Retrieval-Augmented Generation)
            incorrectExplanation: RAG is the pattern of retrieving data and using it
              to generate responses. The universal tool connector standard is MCP.
          - id: c
            value: NLP (Natural Language Processing)
            incorrectExplanation: NLP is the field of AI focused on understanding
              human language. The tool connection standard is MCP.
  - id: "3"
    questions:
      - id: "1"
        type: choice
        content: Two AI models compete against each other. One generates content, the
          other tries to detect whether it is real or fake. Both improve through
          this competition. What is this technique called?
        options:
          - id: a
            value: GANs (Generative Adversarial Networks)
            explanation: GANs pit two models against each other to improve. They are
              purely generative, not agentic. They show up in image generation,
              deepfakes, and data augmentation.
            isCorrect: true
          - id: b
            value: RLHF (Reinforcement Learning from Human Feedback)
            incorrectExplanation: RLHF uses human ratings to improve a model. The
              two-models-competing technique is called GANs.
          - id: c
            value: RAG (Retrieval-Augmented Generation)
            incorrectExplanation: RAG retrieves external data to augment responses.
              The adversarial competition technique is called GANs.